name: plantops
description: A Flutter app connecting plant nurseries with customers for better plant care
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Core infrastructure
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  # firebase_storage: ^11.5.6  # TODO: Enable when Storage bucket is created
  firebase_messaging: ^16.1.1
  
  # State Management
  provider: ^6.1.1
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  cloudinary_public: ^0.21.0
  
  # Google Sign In (ADDED - was missing!)
  google_sign_in: ^6.2.1
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  
  # UI Components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
